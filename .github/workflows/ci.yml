name: CI for project

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  ci_workflow:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install project with dev dependencies
      run: pip install -e ".[dev]"

    - name: ruff check
      run: ruff check .

    - name: ruff format --check
      run: ruff format --check .

    - name: mypy
      run: mypy

    - name: pytest
      run: pytest
